<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>i回家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* =====================================================================
   i回家 互動原型 — 樣式 (css/style.css)
   想改顏色：直接改最前面 :root { ... } 裡的 --變數（淺色），
   以及下方 @media (prefers-color-scheme:dark) 與 [data-theme="dark"] 兩處（深色）。
   ===================================================================== */
/* ===== 基礎重設（網頁載入時的預設值）===== */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: sticky top bar + one routed view at a time; bottom tab bar on phones. Warm paper ground, IKEA-blue ink, yellow for the single call to action, green only for circular/points meaning. */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --surface2:#EFEDE5; --ink:#102A43; --muted:#5B6773;
  --brand:#0A58A8; --on-brand:#FFFFFF; --navy:#073568; --on-navy:#FFFFFF; --yellow:#FFD84A; --on-yellow:#1B2A3A;
  --green:#2E6B50; --mint:#DCEBE1; --line:#E2DFD4; --warn:#B4531A; --warn-bg:#FBE9DA; --ok:#1F7A4D; --ok-bg:#DDF1E5;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 8px 24px rgba(16,42,67,.07);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A28; --surface:#14263A; --surface2:#1A3048; --ink:#E8EEF5; --muted:#A3B3C4;
  --brand:#6CAEF2; --on-brand:#06182C; --navy:#0A2B52; --on-navy:#FFFFFF; --green:#86CDA6; --mint:#1B3B30; --line:#243C56;
  --warn:#F0A46F; --warn-bg:#3A2A1C; --ok:#7FD4A3; --ok-bg:#173A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A28; --surface:#14263A; --surface2:#1A3048; --ink:#E8EEF5; --muted:#A3B3C4;
  --brand:#6CAEF2; --on-brand:#06182C; --navy:#0A2B52; --on-navy:#FFFFFF; --green:#86CDA6; --mint:#1B3B30; --line:#243C56;
  --warn:#F0A46F; --warn-bg:#3A2A1C; --ok:#7FD4A3; --ok-bg:#173A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* banner + header */
.banner{background:var(--navy);color:var(--on-navy);font-size:13px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:7px max(16px,env(safe-area-inset-left,0px))}
.banner .wrap{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner b{color:var(--yellow);font-weight:700}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:900;font-size:22px;letter-spacing:.02em;border:0;background:none;padding:0}
.logo img{height:34px;width:auto;max-width:96px;object-fit:contain;display:block}
.logo.nologo img{display:none}
.logo:not(.nologo) img+span{padding-left:12px;border-left:1px solid var(--line)}
nav.main{display:flex;gap:4px;margin-left:8px}
nav.main button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;color:var(--ink)}
nav.main button[aria-current="page"]{background:var(--mint);color:var(--green);font-weight:700}
nav.main button:hover{background:var(--surface2)}
.bar .sp{flex:1}
.pill-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:500;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;transition:transform .12s,background .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--navy)}
.btn.cta{background:var(--yellow);color:var(--on-yellow)}
.btn.cta:hover{filter:brightness(.96)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabbar{display:none}
@media (max-width:960px){
  nav.main,.bar .hide-sm{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;padding:6px 0;color:var(--muted);min-width:0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--green);font-weight:700}
}

/* common blocks */
main{padding-block:0 40px;min-height:60vh}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--green)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--green)}
.sec{padding-block:48px 8px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font-size:clamp(26px,4vw,38px);font-weight:900;color:var(--navy);margin-top:6px}
:root[data-theme="dark"] .sec-h h2{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec-h h2{color:var(--ink)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mint);color:var(--green)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.plain{background:var(--surface2);color:var(--muted)}
.chip.white{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:620px){.g2,.g4{grid-template-columns:1fr}}
.icon{width:20px;height:20px;flex:none}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-block:56px 44px}
.hero h1{font-size:clamp(38px,6.2vw,66px);font-weight:900;color:var(--navy);letter-spacing:-.01em;line-height:1.12;margin-top:14px}
:root[data-theme="dark"] .hero h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:var(--ink)}}
.hero h1 .nb{white-space:nowrap}
.hero p.lead{font-size:18px;color:var(--muted);margin-top:18px;max-width:34em}
.hero .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero .triple{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px}
.hero .triple div{min-width:0}
.hero .triple b{display:block;font-size:17px;color:var(--navy)}
:root[data-theme="dark"] .hero .triple b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .triple b{color:var(--ink)}}
.hero .triple span{font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px;padding-block:32px 28px}}
.story-card{padding:20px;position:relative}
.story-card .tl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.story-card .tl small{display:block;color:var(--muted);font-size:12.5px}
.story-card .tl strong{font-size:17px}
.art{border-radius:14px;display:block;width:100%;background:color-mix(in srgb,var(--tint,#7fb59a) 22%,var(--surface))}
.art svg{display:block;width:100%;height:auto}
.story-card .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:10px}
.story-card .meta .price{font-size:30px;font-weight:900;color:var(--brand)}
.value-band{background:var(--navy);color:var(--on-navy);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.value-band .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.value-band .it{padding:26px 26px 26px 0;border-right:1px solid rgba(255,255,255,.18)}
.value-band .it+.it{padding-left:26px}
.value-band .it:last-child{border-right:0}
.value-band h3{color:var(--yellow);font-size:16px;margin-bottom:6px}
.value-band p{font-size:14.5px;opacity:.92}
@media (max-width:760px){.value-band .wrap{grid-template-columns:1fr}.value-band .it,.value-band .it+.it{padding:18px 0;border-right:0;border-bottom:1px solid rgba(255,255,255,.18)}}
.feat{padding:22px}
.feat .ic{width:46px;height:46px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center;margin-bottom:14px}
.feat h3{font-size:18px;margin-bottom:6px}
.feat p{font-size:14.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:18px;overflow:hidden}
.steps .st{padding:18px;border-right:1px solid var(--line)}
.steps .st:last-child{border-right:0}
.steps b{display:block;font-size:15.5px;margin:6px 0 2px}
.steps small{color:var(--muted);font-size:13px;display:block}
.steps .n{font-family:var(--f-mono);font-size:12.5px;color:var(--green);font-weight:500}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}.steps .st{border-bottom:1px solid var(--line)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}.steps .st{border-right:0}}

/* product cards */
.pcard{overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:18px;transition:transform .15s,box-shadow .15s;width:100%}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard .pic{position:relative;border-radius:0;background:color-mix(in srgb,var(--tint,#7fb59a) 22%,var(--surface))}
.pcard .pic .chip{position:absolute;left:12px;top:12px}
.pcard .pic .heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.pcard .pic .heart[aria-pressed="true"]{color:#D6336C}
.pcard .pic .heart[aria-pressed="true"] svg{fill:currentColor}
.pcard .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.pcard .loc{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pcard h3{font-size:16.5px;font-weight:700}
.pcard .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.pcard .price{font-size:21px;font-weight:900;color:var(--navy)}
:root[data-theme="dark"] .pcard .price{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pcard .price{color:var(--ink)}}
.pcard .go{font-size:14px;font-weight:700;color:var(--brand)}
.pcard .strike{font-size:12.5px;color:var(--muted);text-decoration:line-through;margin-left:6px}

/* browse */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;margin-bottom:20px}
.filters label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{width:100%;resize:vertical;min-height:84px}
input[type=range]{accent-color:var(--brand);width:100%}
.pagehead{padding-block:34px 18px}
.pagehead h1{font-size:clamp(28px,4.4vw,42px);font-weight:900;color:var(--navy);margin-top:6px}
:root[data-theme="dark"] .pagehead h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pagehead h1{color:var(--ink)}}
.pagehead p{color:var(--muted);margin-top:8px;max-width:42em}

/* detail */
.crumb{padding-block:20px 8px;font-size:14px}
.crumb button{border:0;background:none;color:var(--brand);padding:0;font-weight:500}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.panel{padding:22px}
.panel h3{font-size:18px;margin-bottom:12px}
.panel+.panel{margin-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.flaws{display:flex;flex-wrap:wrap;gap:8px}
.tl-hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl-hist li{position:relative;padding:0 0 16px 20px;font-size:14.5px}
.tl-hist li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--green)}
.tl-hist li small{display:block;color:var(--muted)}
.buybox{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.buybox{position:static}}
.bigprice{font-size:38px;font-weight:900;color:var(--navy)}
:root[data-theme="dark"] .bigprice{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bigprice{color:var(--ink)}}
.fee{width:100%;border-collapse:collapse;font-size:14.5px}
.fee td{padding:7px 0;border-bottom:1px dashed var(--line)}
.fee td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.fee tr.total td{border-bottom:0;font-weight:900;font-size:18px;padding-top:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;gap:6px}
.toggle button{flex:1;border:1px solid var(--line);background:var(--surface);padding:9px 10px;border-radius:10px;font-size:14px;font-weight:500}
.toggle button[aria-pressed="true"]{background:var(--mint);border-color:var(--green);color:var(--green);font-weight:700}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.qr{width:104px;height:104px;flex:none;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}

/* sell wizard */
.wiz{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:20px}
@media (max-width:900px){.wiz{grid-template-columns:1fr;gap:16px}}
.rail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rail li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;font-size:15px;color:var(--muted)}
.rail li .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;background:var(--surface)}
.rail li.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.rail li.on .dot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.rail li.done .dot{background:var(--green);border-color:var(--green);color:var(--on-brand)}
@media (max-width:900px){.rail{flex-direction:row;overflow-x:auto;gap:6px}.rail li{white-space:nowrap;padding:8px 10px}}
.wizcard{padding:26px}
.wizcard h2{font-size:24px;font-weight:900;margin-bottom:6px;color:var(--navy)}
:root[data-theme="dark"] .wizcard h2{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wizcard h2{color:var(--ink)}}
.wizcard .sub{color:var(--muted);margin-bottom:20px}
.wiznav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--surface2);min-height:150px;justify-content:center;position:relative;overflow:hidden}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .cap{position:relative;font-size:13px;font-weight:700;background:var(--surface);padding:3px 10px;border-radius:999px}
.drop label{cursor:pointer}
.cands{display:flex;flex-direction:column;gap:10px}
.cand{display:flex;align-items:center;gap:14px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.cand[aria-pressed="true"]{border-color:var(--green);background:var(--mint)}
.cand .thumb{width:68px;border-radius:10px;background:color-mix(in srgb,var(--tint) 22%,var(--surface));flex:none;overflow:hidden}
.cand .conf{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);flex:none}
.cand .conf b{display:block;font-size:18px;color:var(--ink)}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px;width:90px}
.meter i{display:block;height:100%;background:var(--green)}
.scanner{position:fixed;inset:0;z-index:60;background:rgba(5,14,24,.86);display:grid;place-items:center;padding:20px}
.scanbox{width:min(340px,100%);aspect-ratio:1;border-radius:22px;position:relative;background:#0b1b2c;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.scanbox::before{content:"";position:absolute;inset:18px;border:3px solid var(--yellow);border-radius:14px}
.scanbox .line{position:absolute;left:18px;right:18px;height:3px;background:var(--yellow);box-shadow:0 0 18px var(--yellow);animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{top:22%}to{top:78%}}
.scanbox .tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46%;opacity:.9}
.scanmsg{color:#fff;text-align:center;margin-top:18px;font-weight:500}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--green)}
.tagbtns{display:flex;flex-wrap:wrap;gap:8px}
.tagbtns button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:14px}
.tagbtns button[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:700}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.grades{grid-template-columns:1fr 1fr}}
.grades button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;text-align:center;font-size:14px;line-height:1.35}
.grades button b{display:block;font-size:15px}
.grades button small{color:var(--muted)}
.grades button[aria-pressed="true"]{border-color:var(--green);background:var(--mint)}
.range-box{background:var(--surface2);border-radius:16px;padding:18px}
.range-big{font-size:32px;font-weight:900;color:var(--navy)}
:root[data-theme="dark"] .range-big{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .range-big{color:var(--ink)}}
.track{position:relative;height:10px;background:var(--line);border-radius:99px;margin:20px 0 6px}
.track .band{position:absolute;top:0;bottom:0;background:var(--green);opacity:.4;border-radius:99px}
.track .mark{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--brand);border:3px solid var(--surface);transform:translateX(-50%);box-shadow:var(--shadow)}
.factors{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.factor{display:grid;grid-template-columns:120px 1fr 72px;gap:10px;align-items:center;font-size:13.5px}
.factor .bar2{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.factor .bar2 i{display:block;height:100%;background:var(--brand)}
.factor span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;font-size:14px}
.slots button small{display:block;color:var(--muted)}
.slots button[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.slots button[disabled]{opacity:.45}
.success{text-align:center;padding:12px 0}
.success .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--on-brand);display:grid;place-items:center;margin:0 auto 14px}

/* tracker */
.trk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:24px;align-items:start}
@media (max-width:900px){.trk{grid-template-columns:1fr}}
.stepper{list-style:none;margin:0;padding:0}
.stepper li{position:relative;display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:22px}
.stepper li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper .ball{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.stepper li.done .ball{background:var(--green);border-color:var(--green);color:var(--on-brand)}
.stepper li.now .ball{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent)}
.stepper li.done::before{background:var(--green)}
.stepper b{display:block;font-size:16px}
.stepper small{color:var(--muted);font-size:13.5px;display:block}
.stepper li.todo b{color:var(--muted);font-weight:500}
.report{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.report .ph{border-radius:12px;overflow:hidden;position:relative;background:color-mix(in srgb,var(--tint) 22%,var(--surface))}
.report .ph .chip{position:absolute;left:8px;top:8px}
.okrow{display:flex;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.okrow svg{color:var(--ok)}

/* points */
.pts-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:22px}
@media (max-width:760px){.pts-hero{grid-template-columns:1fr}}
.bal{background:var(--navy);color:#fff;border-radius:20px;padding:26px}
.bal .big{font-size:56px;font-weight:900;line-height:1;color:var(--yellow)}
.prog{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin:16px 0 8px}
.prog i{display:block;height:100%;background:var(--yellow)}
.reward{padding:18px;display:flex;flex-direction:column;gap:10px}
.reward .rpic{height:110px;border-radius:12px;background:var(--mint);display:grid;place-items:center}
.reward h3{font-size:16.5px}
.reward .cost{font-weight:900;color:var(--green);font-size:20px}
.hist{width:100%;border-collapse:collapse;font-size:14.5px}
.hist td{padding:10px 0;border-bottom:1px solid var(--line)}
.hist td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--warn)}

/* backend */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi b{font-size:26px;font-weight:900;display:block;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;font-weight:700}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.cap-bar{height:8px;width:96px;background:var(--surface2);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.cap-bar i{display:block;height:100%;background:var(--brand)}
.cap-bar.hi i{background:var(--warn)}
.funnel{display:flex;flex-direction:column;gap:10px}
.fun{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.fun .b{height:22px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fun .b i{display:block;height:100%;background:var(--brand);border-radius:6px}
.fun span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.run{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.run:last-child{border-bottom:0}
.run b{font-size:15px}
.run small{display:block;color:var(--muted)}
.econ td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.econ td{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.econ tr.sum td{font-weight:900;font-size:17px;border-bottom:0;padding-top:10px}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,14,24,.55);display:grid;place-items:center;padding:16px}
.modal{width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;padding:24px}
.modal h3{font-size:20px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:500;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:961px){.toast{bottom:28px}}
footer.foot{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13px}
footer.foot .wrap{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* address book + fee detail + floor input */
.ferr{color:var(--warn);font-size:12.5px;font-weight:500;min-height:0}
.ferr:empty{display:none}
input[type=number]{width:100%}
.field input,.field select{width:100%}
.row2>*{min-width:0}
input[aria-invalid="true"]{border-color:var(--warn);outline-color:var(--warn)}
.fee tr.sub td{font-size:13px;color:var(--muted);padding:4px 0 4px 14px}
.fee td small{font-size:12.5px}
.addr-sum{font-size:14px;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.6}
.linkbtn{border:0;background:none;color:var(--brand);font-size:13.5px;font-weight:700;padding:0;text-decoration:underline}
.addr-list{display:flex;flex-direction:column;gap:8px}
.addr-opt{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14.5px}
.addr-opt small{color:var(--muted);font-size:13px}
.addr-opt[aria-pressed="true"]{border-color:var(--green);background:var(--mint)}
.addr-card{padding:18px;display:flex;flex-direction:column;gap:6px}
.ac-top{display:flex;gap:8px;flex-wrap:wrap}
.ac-who{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:17px;margin-top:4px}
.ac-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill-btn .lbl{display:inline}
.logo,.logo span,nav.main button,.pill-btn,.bar .btn{white-space:nowrap;flex:none}
@media (max-width:1360px){.pill-btn .lbl{display:none}nav.main button{padding:8px 10px;font-size:14px}.bar{gap:12px}}
@media (max-width:1000px){nav.main button{padding:8px 8px;font-size:13.5px}.logo{font-size:20px}}
@media (max-width:960px){.tabbar{grid-template-columns:repeat(6,1fr)}.tabbar button{font-size:11px}}

/* ---------- auction + 3D viewer ---------- */
.note.warn{background:var(--warn-bg);color:var(--warn)}
.modal.wide{width:min(720px,100%)}
.auc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.auc-top b{font-size:15px;color:var(--warn)}
.auc-meta{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:4px}
.guide{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.guide summary{cursor:pointer;font-weight:700;color:var(--ink)}
.guide p,.guide ol{margin-top:8px;line-height:1.6}
.guide ol{padding-left:1.3em}
.guide li{margin-bottom:6px}
.guide.demo{border-style:dashed}
table.tbl.bids-tbl{min-width:0;margin-top:8px}
.gal-tabs{display:flex;border-bottom:1px solid var(--line)}
.gal-tabs button{flex:1;border:0;background:var(--surface2);padding:12px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.gal-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;border-bottom-color:var(--brand)}
.v3{padding:0 0 14px}
.v3stage{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 24%,var(--surface)),var(--surface2))}
.v3cv{display:block;width:100%;aspect-ratio:5/4;touch-action:none;cursor:grab;outline-offset:-3px}
.v3cv:active{cursor:grabbing}
.v3tag{position:absolute;left:12px;top:12px}
.v3hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12.5px;color:var(--muted);pointer-events:none}
.v3bar{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0}
.v3bar .btn[aria-pressed="true"]{background:var(--mint);border-color:var(--green);color:var(--green)}
.v3spots{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0}
.v3spots button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px}
.v3spots button[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-bg);font-weight:700}
.v3n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#D6402B;color:#fff;font-size:12px;font-weight:700}
.v3info{padding:10px 14px 0;font-size:14px;min-height:44px}
.v3meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 14px 0;font-size:13px}
.evid{padding-left:1.2em;font-size:14px;line-height:1.6}
.evid li{margin-bottom:6px}
.shots button{min-width:64px}
@media (max-width:960px){.v3cv{aspect-ratio:4/3}}

/* ---------- 賣家評價 + 營運管理 ---------- */
.avt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c,#5FA586);color:#fff;font-weight:700;font-size:11px;flex:none}
.sellerline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin:6px 0 2px;color:var(--muted)}
.sellerline.as-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;margin:0 0 12px;cursor:pointer;color:var(--muted)}
.sellerline.as-btn:hover{border-color:var(--brand)}
.sl-name{color:var(--ink);font-weight:700}.sl-star{color:var(--warn);font-weight:700}
.sc-head{display:flex;gap:14px;align-items:center;margin:12px 0}
.sc-head .avt{width:56px;height:56px}
.sc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:8px 0}
.sc-stats>div{background:var(--surface2);border-radius:12px;padding:10px 4px}
.sc-stats b{font-size:24px;display:block}.sc-stats small{color:var(--muted);font-size:12.5px}
.sc-cats{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sc-cats .fun{grid-template-columns:90px 1fr 40px}
.stars{color:#E0A100;letter-spacing:1px;white-space:nowrap}
.rv-top{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.rv-big{text-align:center}.rv-big b{font-size:44px;font-weight:900;display:block;line-height:1}.rv-big small{display:block;color:var(--muted)}
.rv-dist{display:flex;flex-direction:column;gap:6px}.rv-dist .fun{grid-template-columns:44px 1fr 28px}
.rv-list{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow:auto}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.rv p{margin:4px 0;font-size:14.5px}
.rv-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.starpick{display:flex;align-items:center;gap:2px}
.starpick button{border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:2px 3px;cursor:pointer}
.starpick button.on{color:#E0A100}
.mycase{border-top:1px dashed var(--line);padding:10px 0}.mycase:first-of-type{border-top:0}
/* ops nav */
.opsnav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.opsnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:500;white-space:nowrap}
.opsnav button[aria-current="page"]{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.bdg{display:inline-block;min-width:20px;margin-left:8px;padding:1px 6px;border-radius:999px;background:#D6402B;color:#fff;font-size:12px;font-weight:700;text-align:center}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .unit{font-size:14px;font-weight:500;color:var(--muted)}
.h2s{font-size:22px;font-weight:900;margin:28px 0 12px}
.catgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.catcard{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.catcard b{font-size:24px}.catcard i{position:absolute;left:0;bottom:0;height:4px;background:var(--brand)}
.catcard.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:start;padding:16px 18px}
.filters .field{margin-bottom:0}
.clickrow{cursor:pointer}.clickrow:hover td,.clickrow:focus-visible td{background:var(--surface2)}
.cs-tbl{min-width:760px}.sumcell{max-width:260px}
.chip.st-todo{background:var(--warn-bg);color:var(--warn)}
.chip.st-doing{background:color-mix(in srgb,var(--brand) 16%,var(--surface));color:var(--brand)}
.chip.st-wait{background:var(--surface2);color:var(--muted)}
.chip.st-done{background:var(--mint);color:var(--green)}
.chip.st-bad{background:color-mix(in srgb,#D6402B 16%,var(--surface));color:color-mix(in srgb,#D6402B 75%,var(--ink))}
.chip.pri-h{background:color-mix(in srgb,#D6402B 16%,var(--surface));color:color-mix(in srgb,#D6402B 75%,var(--ink))}
.chip.pri-m{background:var(--warn-bg);color:var(--warn)}.chip.pri-l{background:var(--surface2);color:var(--muted)}
.overlay.side{place-items:stretch end;padding:0}
.modal.drawer{width:min(560px,100%);height:100%;max-height:none;border-radius:18px 0 0 18px;padding:20px 22px}
.dr-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.dr-h h3{margin:2px 0 0;font-size:19px}
.dr-tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.dr-s{font-size:14px;margin:18px 0 8px;font-weight:700}
.convo{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow:auto;padding:10px;background:var(--surface2);border-radius:12px}
.bub{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14.5px}.bub p{margin:2px 0 0;white-space:pre-wrap}.bub small{font-size:12px;color:var(--muted)}
.bub.cu{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.bub.sys{align-self:center;max-width:100%;text-align:center;font-size:12.5px;color:var(--muted)}.bub.sys span{background:var(--surface);padding:2px 10px;border-radius:999px;border:1px solid var(--line)}.bub.sys small{display:block}
.cs-photos{display:flex;gap:10px;flex-wrap:wrap}.cs-photos figure{margin:0;width:150px}.cs-photos figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.dr-s2{margin-top:14px}
.donutrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.donut b{position:relative;z-index:1;font-size:26px}
.legend{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}.legend i{width:12px;height:12px;border-radius:3px}.legend b{margin-left:auto;padding-left:16px}
.fun.wide{grid-template-columns:110px 1fr 40px}
.wkbars{display:flex;gap:10px;align-items:flex-end;height:170px}
.wkbars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12.5px}
.wkbars i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:4px}.wkbars>div:last-child i{background:var(--green)}.wkbars small{color:var(--muted)}
@media (max-width:960px){
  .kpis.k5,.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .catgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}
  .rv-top{grid-template-columns:1fr}
  .modal.drawer{border-radius:0}
}


/* ---- 細節優化：樓層選擇、售價輸入、客服對話 ---- */
.floorsel{flex-wrap:wrap;margin:2px 0 8px}
.floorsel button{white-space:normal}
.pin{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pin:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.pin b{padding:0 4px 0 14px;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.pin input{border:0!important;outline:0!important;font-size:24px;font-weight:700;padding:10px 12px 10px 4px;width:100%;background:transparent;font-variant-numeric:tabular-nums}
.priceHint{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.kv dd.dims{font-variant-numeric:tabular-nums}
.convo{gap:12px}
.msg{display:flex;width:100%}
.msg.customer{justify-content:flex-start}
.msg.agent,.msg.seller{justify-content:flex-end}
.msg.sys{justify-content:center}
.msg .bub{max-width:min(86%,440px);min-width:0;overflow-wrap:anywhere;word-break:break-word}
.msg .bub .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .bub .bh b{font-size:13px}
.msg .bub .role{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.msg .bub time{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.msg.customer .bub{background:var(--surface);border:1px solid var(--line)}
.msg.agent .bub{background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.msg.seller .bub{background:var(--mint)}
.msg.sys .bub{max-width:100%;background:none;padding:0;text-align:center}
.msg.sys .bub span{display:inline-block;background:var(--surface);padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cs-photos{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:4px}
@media (max-width:560px){.range-big{font-size:24px!important;word-break:keep-all}}
</style>

const FLOOR_MAX=99;

  const t=String(v==null?'':v).trim();
  if(t==='')return '請輸入樓層';
  if(!/^\d+$/.test(t))return '請輸入正整數，例如 12';
  const n=+t;
  if(n<1)return '樓層至少為 1';
  if(n>FLOOR_MAX)return `樓層請在 1–${FLOOR_MAX} 之間`;
  return '';
}

function calcFees(it,c){

const addrFull=a=>`${addrText(a)} ${floorShow(a.floor)}`;
function normAddrKey(k){if(k==='manual')return 'manual';if(k&&addrById(k))return k;const d=defaultAddr();return d?d.id:'manual'}
const snapAddr=a=>({label:a.label,name:a.name,phone:a.phone,text:addrText(a),floor:a.floor,elev:a.elev});
function buyCtx(){
  const b=S.buy,key=normAddrKey(b.addr);
  if(key!=='manual'){const a=addrById(key),none=a.floor==null;return{mode:b.mode,help:b.help,area:a.district,floor:none?1:a.floor,floorNone:none,elev:a.elev,addr:a,valid:true}}
  const fe=b.floorNone?'':floorErr(b.floorTxt);
  return{mode:b.mode,help:b.help,area:b.area,floor:fe||b.floorNone?1:+b.floorTxt,floorNone:!!b.floorNone,elev:b.elev,addr:null,valid:!fe,floorErr:fe};
}
function sellCtx(s){
  const key=normAddrKey(s.addr);
  if(key!=='manual'){const a=addrById(key),none=a.floor==null;return{addr:a,area:a.district,floor:none?1:a.floor,floorNone:none,elev:a.elev,valid:true}}
  const fe=s.floorNone?'':floorErr(s.floorTxt);
  return{addr:null,area:s.area,floor:fe||s.floorNone?1:+s.floorTxt,floorNone:!!s.floorNone,elev:s.elev,valid:!fe,floorErr:fe};
}
loadAddrs();

function sellerNet(price){
  if(price<500)return{fee:0,pct:0,fixed:0,net:price,small:true};
  const pct=Math.round(price*.05),fixed=70;return{fee:pct+fixed,pct,fixed,net:price-pct-fixed,small:false};
}

const NAV=[['home','認識 i回家','home'],['browse','找下一個家','search'],['sell','我要幫它找家','scan'],['track','我的訂單','box'],['points','綠循點','leaf'],['ikea','IKEA 營運端','chart']];

function route(){const h=(location.hash||'#home').slice(1);return ROUTES.includes(h)?h:'home'}
function go(r){if(location.hash==='#'+r)render();else location.hash=r}
function renderNav(){

  $('#nav').innerHTML=NAV.map(([k,t])=>`<button data-go="${k}" ${k===cur?'aria-current="page"':''}>${t}</button>`).join('');

function toast(msg){
  $('#layer .toast')?.remove();
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;$('#layer').appendChild(t);
  setTimeout(()=>t.remove(),2800);
}
function modal(html){
  const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card modal" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeModal()});

function qrSvg(seed){
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const rnd=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
  const n=21;let s='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#102A43"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#102A43"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;
    if(rnd()>.52)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#102A43"/>`}
  return `<svg class="qr" viewBox="-1 -1 23 23" role="img" aria-label="i家履歷 QR Code（示意）" shape-rendering="crispEdges">${s}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

function filtered(){
  const f=S.filter;
  let l=ITEMS.filter(i=>(typeof listVisible!=='function'||listVisible(i))&&(!f.fav||S.favs.has(i.id))&&(f.cat==='全部'||i.cat===f.cat)&&(f.area==='全部'||i.area===f.area)&&(f.cond==='全部'||COND[i.cond].t===f.cond)&&(i.mode==='bid'?i.bid:i.price)<=f.max);
  const pr=i=>i.mode==='bid'?i.bid:i.price;if(f.sort==='lo')l=[...l].sort((a,b)=>pr(a)-pr(b));if(f.sort==='hi')l=[...l].sort((a,b)=>pr(b)-pr(a));
  return l;
}
function plist(list){
  return list.length?list.map(i=>productCard(i,i.fresh)).join(''):`<div class="card panel" style="grid-column:1/-1;text-align:center"><h3>沒有符合條件的家具</h3><p class="muted">調高價格上限，或把品類與區域改成「全部」。</p><button class="btn ghost sm" style="margin-top:12px" data-reset="1">清除篩選</button></div>`;

function feeRows(it,c){
  const f=calcFees(it,c);

  if(f.pick)r+=`<tr><td>配送費（自取）</td><td>${money(0)}</td></tr><tr><td>搬運服務費</td><td class="muted">自取不適用</td></tr>`;

    r+=`<tr><td>配送費　${TIER[tierOf(c.area)].t}<br><small class="muted">送到一樓大門口，不含搬運上樓</small></td><td>${money(f.ship)}</td></tr>`;

    }else r+=`<tr><td>搬運服務費<br><small class="muted">未選擇人員協助</small></td><td>${money(0)}</td></tr>`;
  }
  return r+`<tr class="total"><td>下單前總額</td><td>${money(f.total)}</td></tr>`;
}

const okPhone=p=>{const d=p.replace(/[\s-]/g,'');return /^09\d{8}$/.test(d)||/^0[2-8]\d{7,8}$/.test(d)};
function validateAF(){
  const f=AF,e={};
  if(f.label==='自訂'&&!f.custom.trim())e.label='請輸入地址名稱';
  if(!f.name.trim())e.name='請輸入收件人';
  if(!okPhone(f.phone.trim()))e.phone='請輸入手機（09xx-xxx-xxx）或市話';
  if(f.detail.trim().length<4)e.detail='請輸入完整的路名與門牌號碼';
  const fe=f.floorNone?'':floorErr(f.floorTxt);if(fe)e.floor=fe;
  return e;
}
function showAFErrs(e){['label','name','phone','detail','floor'].forEach(k=>{const el=$('#e-'+k);if(el)el.textContent=e[k]||''})}

  const f=AF;f.tried=true;const e=validateAF();showAFErrs(e);

  const rec={id:f.id||'a'+Date.now(),label:f.label==='自訂'?f.custom.trim():f.label,name:f.name.trim(),phone:f.phone.trim(),district:f.district,detail:f.detail.trim(),floor:f.floorNone?null:+f.floorTxt,elev:f.elev,def:!!f.def};
  if(!f.id&&ADDRS.length>=10){toast('最多可儲存 10 個地址');return}
  if(f.id){const i=ADDRS.findIndex(a=>a.id===f.id);ADDRS[i]={...rec,def:ADDRS[i].def||rec.def}}else ADDRS.push(rec);
  if(rec.def||!ADDRS.some(a=>a.def)){ADDRS.forEach(a=>a.def=a.id===rec.id)}
  saveAddrs();closeModal();toast(f.id?'地址已更新':'地址已儲存');
  const cb=f.after;AF=null;
  if(cb)cb(addrById(rec.id));else render(true);
}
function deleteAddr(id){
  const was=addrById(id);ADDRS=ADDRS.filter(a=>a.id!==id);

  saveAddrs();
  if(S.buy.addr===id)S.buy.addr='default';
  if(S.sell&&S.sell.addr===id)S.sell.addr='default';

}

/* ---------- AUCTION（買家競標） ---------- */
/* 出價增額：目前價格 $1,000 以下 +$20、$3,000 以下 +$50、以上 +$100 */
const bidInc=p=>p<1000?20:p<3000?50:100;
const minBid=it=>it.bids&&it.bids.length?it.bid+bidInc(it.bid):it.floorBid;
const nowStr=()=>{const d=new Date();return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const MEMBER_KEY='ihome-member';
let MEMBER=null;
try{const m=JSON.parse(localStorage.getItem(MEMBER_KEY)||'null');if(m&&m.nick)MEMBER=m}catch(e){}
function saveMember(){try{if(MEMBER)localStorage.setItem(MEMBER_KEY,JSON.stringify(MEMBER))}catch(e){}}

function addBid(it,who,amt,type){it.bids.unshift({who,amt,type,t:nowStr()});it.bid=amt;it.leader=who;it.count=(it.count||0)+1}
/* 代理出價：我的自動出價上限（myMax）與對手的隱藏上限（rival）互相加價，直到其中一方到頂 */
function resolveAuto(it){
  let outbid=false,guard=0;
  while(guard++<400){
    const need=it.bid+bidInc(it.bid);
    if(it.leader!=='me'&&it.myMax&&it.myMax>=need){addBid(it,'me',Math.min(it.myMax,need),'自動出價');continue}
    if(it.leader==='me'&&it.rival&&it.rival>=need){addBid(it,it.rivalName||'b***3',Math.min(it.rival,need),'自動出價');outbid=true;continue}
    break;
  }
  return outbid;
}
function doBid(it,kind,amt){
  if(kind==='direct')addBid(it,'me',amt,'直接出價');
  else{
    const wasLead=it.leader==='me';
    it.myMax=amt;
    if(!wasLead)addBid(it,'me',minBid(it),'自動出價');
    else return{lead:true,updated:true};
  }
  const out=resolveAuto(it);
  return{lead:it.leader==='me',out};
}
function aucErr(it,mode,v){
  if(!Number.isInteger(v))return '請輸入整數金額';
  if(v<minBid(it))return `金額至少要 ${money(minBid(it))}`;
  if(v>9999999)return '金額過大，請確認後重新輸入';
  if(mode==='direct'&&it.leader==='me')return '你已是最高出價者。想提高上限，請改用「自動出價」';
  if(mode==='direct'&&it.buyNow&&v>=it.buyNow)return `出價已達直購價 ${money(it.buyNow)}，請改按「立即結標」`;
  return '';
}
function endAuction(it){
  if(it.ended)return;
  it.ended=true;it.endsIn=0;it.won=it.leader==='me';
  if(route()==='item'&&S.item===it.id)render(true);
  if(it.won){
    modal(`<h3>恭喜得標</h3><p style="margin-bottom:12px">你以 <b class="num">${money(it.bid)}</b> 得標「${esc(it.name)}」。</p>
      <div class="note warn" style="margin-bottom:14px">請於 3 日內完成付款與交付方式選擇。無故不付款將被記錄棄標，影響你的競標權益。</div>
      <div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" data-close="1">稍後再說</button><button class="btn cta" style="flex:1.4" data-win-pay="${it.id}">前往結帳</button></div>`);
  }else{
    modal(`<h3>${it.bids.length?'這次沒有得標':'競標結束，無人出價'}</h3><p class="muted" style="margin-bottom:14px">${it.bids.length?`最終得標價 ${money(it.bid)}。你的出價與自動出價上限不會被扣款。`:'這件家具流標，賣家可以重新刊登或調整價格。'}</p>
      <button class="btn primary" style="width:100%" data-close="1">我知道了</button>`);
  }
}

function confirmBid(it,kind,amt){
  S.pendingBid={id:it.id,kind,amt};

    ${kind==='buynow'?'<div class="note" style="margin:12px 0 0">立即結標後競標馬上結束，你會成為得標者，接著選擇交付方式並付款。</div>':''}

function runBid(){
  const p=S.pendingBid;if(!p)return;const it=byId(p.id);S.pendingBid=null;closeModal();
  if(!it||it.ended)return;
  if(p.kind==='buynow'){addBid(it,'me',it.buyNow,'立即結標');S.auc.note={id:it.id,t:'ok',m:'你已立即結標。'};endAuction(it);return}
  const r=doBid(it,p.kind,p.amt);
  S.auc.amt[it.id]=undefined;
  if(r.updated)S.auc.note={id:it.id,t:'ok',m:`已更新自動出價上限為 ${money(p.amt)}。`};
  else if(r.lead)S.auc.note={id:it.id,t:'ok',m:`出價成功，你是目前最高出價者，現價 ${money(it.bid)}。`};
  else S.auc.note={id:it.id,t:'warn',m:`你的出價已被超越，現價 ${money(it.bid)}。可以提高出價或設定更高的自動出價上限。`};

}

}

  const rs=OPS.reviews.filter(r=>r.seller===id),n=rs.length;
  const c=[0,1,2].map(k=>n?rs.reduce((a,r)=>a+r.r[k],0)/n:0);

/* 捕捉階段：下架／退回的商品不能購買；回報問題時建立客服案件 */
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);
  if(q('[data-buy]')||q('[data-auc-go]')||q('[data-auc-buynow]')){
    const it=byId(S.item);if(it&&!listVisible(it)){e.stopPropagation();e.preventDefault();toast('這件商品目前無法購買');return}
  }
  if(q('[data-send2]')){
    const o=S.orders[S.order]||S.orders[0],it=byId(o.item),sel=$('#layer .modal input[name="dp"]:checked'),why=sel?sel.parentElement.textContent.trim():'其他問題';
    const ta=$('#layer .modal textarea'),extra=ta?ta.value.trim():'';
    const cat={商品與履歷描述不符:CAT[0],缺少零件:CAT[1],運送途中受損:CAT[2],尺寸與預期不同:CAT[0]}[why]||CAT[5];
    const id='CS-2611-'+String(100+OPS.cases.length+1).padStart(4,'0'),now=Date.now();
    OPS.cases.unshift({id,cust:ME_NAME,contact:'0912-***-678',cat,item:o.item,sum:`${it.name}：${why}`,desc:extra||`買家回報「${why}」，尚未補充說明。`,created:now,pri:cat===CAT[2]||cat===CAT[0]?'高':'中',status:'待處理',photos:[],resolved:null,
      log:[{who:'customer',name:ME_NAME,text:`回報：${why}。${extra}`,t:now},{who:'system',name:'系統',text:`案件已建立，編號 ${id}，等待客服人員指派。`,t:now+1000}]});
    saveOps();
    setTimeout(()=>{toast(`已送出回報，案件編號 ${id}，客服會在 1 個工作天內回覆`);if(route()==='track')render(true)},0);
  }
},true);

document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let el;
  if(el=q('[data-ops-sellerrev]')){openSellerReviews(el.dataset.opsSellerrev);return}
  if(el=q('[data-ops-rate]')){openReviewForm(el.dataset.opsRate);return}
  if(el=q('[data-ops-star]')){const [k,v]=el.dataset.opsStar.split(':').map(Number);if(RF){RF.r[k]=v;const ta=$('#rfText');if(ta)RF.text=ta.value;drawRF()}return}
  if(q('[data-ops-rfgo]')){const ta=$('#rfText');if(ta&&RF)RF.text=ta.value;submitReview();return}
  /* 客服 */
  if(el=q('[data-ops-cat]')){OPSUI.cat=OPSUI.cat===el.dataset.opsCat?'全部':el.dataset.opsCat;refreshCS();return}
  if(q('[data-ops-csreset]')){Object.assign(OPSUI,{q:'',cat:'全部',st:'全部',pri:'全部'});$('#csQ').value='';$('#csSt').value='全部';$('#csPri').value='全部';refreshCS();return}
  if(el=q('[data-ops-case]')){openCase(el.dataset.opsCase);return}
  if(el=q('[data-ops-reply]')){csReply(el.dataset.opsReply);return}
  if(el=q('[data-ops-done]')){const c=OPS.cases.find(x=>x.id===el.dataset.opsDone),ta=$('#csTxt');if(ta&&ta.value.trim().length>=2){c.log.push({who:'agent',name:AGENT,text:ta.value.trim(),t:Date.now()});OPSUI.draft[c.id]=''}
    csSetStatus(c,'已完成','案件已由客服標記為完成');csSync(c.id);toast(`${c.id} 已標記為完成`);return}
  if(el=q('[data-ops-reopen]')){const c=OPS.cases.find(x=>x.id===el.dataset.opsReopen);csSetStatus(c,'處理中','案件已重新開啟');csSync(c.id);toast(`${c.id} 已重新開啟`);return}
  if(el=q('[data-ops-democust]')){const c=OPS.cases.find(x=>x.id===el.dataset.opsDemocust),ta=$('#csTxt');if(ta)OPSUI.draft[c.id]=ta.value;
    const reply=['好的，謝謝你們協助，我會再留意。','我已經補充了資料，請再協助確認。','請問大概多久可以處理好？'][c.log.length%3];
    c.log.push({who:'customer',name:c.cust,text:reply,t:Date.now()});if(c.status==='等待顧客回覆')csSetStatus(c,'處理中','顧客已回覆，案件回到處理中');csSync(c.id);toast('已加入顧客回覆（示範）');return}
  /* 刊登審核 */
  if(el=q('[data-ops-lfilter]')){OPSUI.lst=el.dataset.opsLfilter;refreshReview();return}
  if(el=q('[data-ops-list]')){drawer('');drawListing(el.dataset.opsList);return}
  if(el=q('[data-ops-flagsave]')){lAct(el.dataset.opsFlagsave,'flag');return}
  if(el=q('[data-ops-approve]')){lAct(el.dataset.opsApprove,'approve');return}
  if(el=q('[data-ops-return]')){lAct(el.dataset.opsReturn,'return');return}
  if(el=q('[data-ops-takedown]')){lAct(el.dataset.opsTakedown,'down');return}
  if(el=q('[data-ops-resubmit]')){lAct(el.dataset.opsResubmit,'resubmit');return}
  /* 會員 */
  if(el=q('[data-ops-mem]')){drawer('');drawMember(el.dataset.opsMem);return}
  if(el=q('[data-ops-mstat]')){const [id,s]=el.dataset.opsMstat.split(':');OPS.memberStatus[id]=s;saveOps();drawMember(id);if($('#mList'))$('#mList').innerHTML=memRows();toast(`會員狀態已更新為「${s}」`);return}
  /* 物流 */
  if(el=q('[data-ops-lchip]')){OPSUI.lg=el.dataset.opsLchip;refreshLogi();return}
  if(el=q('[data-ops-logi]')){drawer('');drawLogi(el.dataset.opsLogi);return}
  if(el=q('[data-ops-lset]')){setLogi(el.dataset.opsLset,$('#lgSel').value);return}
  if(el=q('[data-ops-lnext]')){const r=logiRows().find(x=>x.id===el.dataset.opsLnext);setLogi(r.id,LOGI[LOGI.indexOf(r.status)+1]);return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='csQ'){OPSUI.q=t.value;refreshCS()}
  if(t.id==='mQ'){OPSUI.mq=t.value;$('#mList').innerHTML=memRows()}
  if(t.id==='rfText'&&RF)RF.text=t.value;
  if(t.id==='csTxt'){const m=$('#layer .modal.drawer [data-ops-reply]');if(m){OPSUI.draft[m.dataset.opsReply]=t.value;const er=$('#csErr');if(er)er.textContent=''}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='csCat'){OPSUI.cat=t.value;refreshCS()}
  if(t.id==='csSt'){OPSUI.st=t.value;refreshCS()}
  if(t.id==='csPri'){OPSUI.pri=t.value;refreshCS()}
  if(t.id==='mRole'){OPSUI.mrole=t.value;$('#mList').innerHTML=memRows()}
  if(t.id==='mSt'){OPSUI.mst=t.value;$('#mList').innerHTML=memRows()}
  if(t.id==='csStatus'){const b=$('#layer .modal.drawer [data-ops-reply],#layer .modal.drawer [data-ops-reopen]');const id=b?(b.dataset.opsReply||b.dataset.opsReopen):null;if(id){const c=OPS.cases.find(x=>x.id===id),ta=$('#csTxt');if(ta)OPSUI.draft[id]=ta.value;csSetStatus(c,t.value);csSync(id);toast(`案件狀態已更新為「${t.value}」`)}}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-ops-row]')){e.preventDefault();e.target.click()}
});
render(true);

</script>
</body>
</html>
